<hlm-card
  class="w-full max-w-md border-border bg-card shadow-lg transition-all duration-200"
>
  <hlm-card-header class="space-y-1 text-center">
    <h3 hlmCardTitle class="text-2xl font-bold tracking-tight text-foreground">
      Inicia sesión
    </h3>
  </hlm-card-header>

  <div hlmCardContent>
    <form [formGroup]="form" (ngSubmit)="login()" class="space-y-4">
      <hlm-field-group class="grid gap-4">
        <hlm-field class="grid gap-1.5">
          <label
            hlmFieldLabel
            for="email"
            class="text-sm font-medium text-foreground"
            >Correo electrónico</label
          >
          <input
            hlmInput
            type="email"
            id="email"
            placeholder="nombre@ejemplo.com"
            formControlName="email"
            class="w-full bg-background border-input text-foreground focus-visible:ring-2 focus-visible:ring-ring"
          />
          <hlm-field-error validator="required"
            >El correo electrónico es obligatorio.</hlm-field-error
          >
          <hlm-field-error validator="email"
            >Introduce una dirección de correo válida.</hlm-field-error
          >
        </hlm-field>

        <hlm-field class="grid gap-1.5">
          <div class="flex items-center justify-between">
            <label
              hlmFieldLabel
              for="password"
              class="text-sm font-medium text-foreground"
              >Contraseña</label
            >
            <a
              hlmFieldDescription
              class="text-xs text-muted-foreground underline-offset-4 hover:underline hover:text-primary transition-colors cursor-pointer"
              routerLink="."
              (mousedown)="$event.preventDefault()"
            >
              ¿Has olvidado tu contraseña?
            </a>
          </div>
          <input
            hlmInput
            type="password"
            id="password"
            formControlName="password"
            class="w-full bg-background border-input text-foreground focus-visible:ring-2 focus-visible:ring-ring"
          />
          <hlm-field-error validator="required"
            >La contraseña es obligatoria.</hlm-field-error
          >
          <hlm-field-error validator="minlength"
            >La contraseña debe tener al menos 8 caracteres.</hlm-field-error
          >
        </hlm-field>
      </hlm-field-group>

      <div class="grid gap-2 pt-2">
        <button
          hlmBtn
          type="submit"
          [disabled]="form.invalid"
          class="w-full bg-primary text-primary-foreground hover:bg-primary-hover disabled:opacity-50 disabled:pointer-events-none transition-colors"
        >
          Iniciar sesión
        </button>

        <button
          hlmBtn
          variant="outline"
          type="button"
          class="w-full border-border text-foreground hover:bg-secondary hover:text-secondary-foreground transition-colors"
        >
          Iniciar sesión con Google
        </button>
      </div>

      <p
        hlmFieldDescription
        class="text-center text-sm text-muted-foreground pt-2"
      >
        ¿No tienes una cuenta?
        <a
          routerLink="/auth/register"
          class="font-medium text-foreground underline-offset-4 hover:underline hover:text-primary transition-colors cursor-pointer"
          (mousedown)="$event.preventDefault()"
        >
          Regístrate
        </a>
      </p>
    </form>
  </div>
</hlm-card>
