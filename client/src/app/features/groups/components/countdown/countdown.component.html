@if (due()) {
  <p
    [class]="compact() ? 'text-xs font-medium text-destructive' : 'text-sm text-center pt-2 text-destructive'"
  >
    {{ compact() ? t('countdown.soon') : t('countdown.soonQuestion') }}
  </p>
} @else if (label(); as text) {
  @if (compact()) {
    <p
      class="text-xs font-medium"
      [class.text-primary]="!urgent()"
      [class.text-destructive]="urgent()"
    >
      {{ t('countdown.nextIn') }} <span>{{ text }}</span>
    </p>
  } @else {
    <p
      class="text-sm text-center pt-2"
      [class.text-muted-foreground]="!urgent()"
      [class.text-destructive]="urgent()"
    >
      {{ t('countdown.nextQuestionIn') }}
      <span class="font-medium" [class.text-foreground]="!urgent()" [class.text-destructive]="urgent()">{{
        text
      }}</span>
    </p>
  }
}
