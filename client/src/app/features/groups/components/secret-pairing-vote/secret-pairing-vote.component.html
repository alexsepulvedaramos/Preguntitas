<p class="text-xs text-muted-foreground">Elige exactamente 2 personas</p>

<div class="flex flex-col gap-2">
  @for (member of members(); track member.id) {
    <button
      type="button"
      [class]="optionClass(member.id)"
      [attr.aria-pressed]="selected().includes(member.id)"
      (click)="toggle(member.id)"
    >
      {{ member.username }}
    </button>
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="selected().length !== 2"
  (click)="submit()"
>
  Votar
</button>
