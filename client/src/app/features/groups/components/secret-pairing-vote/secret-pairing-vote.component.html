<p class="text-xs text-muted-foreground">{{ t('vote.pickTwo') }}</p>

<div class="flex flex-col gap-2 mt-2">
  @for (member of members(); track member.id) {
    <button
      type="button"
      [class]="optionClass(member.id) + ' py-2.5'"
      [attr.aria-pressed]="selected().includes(member.id)"
      (click)="toggle(member.id)"
    >
      <span class="flex items-center gap-3">
        <app-user-avatar
          [avatarUrl]="member.avatarUrl"
          [username]="member.username"
          [frameColor]="member.frameColor"
          [streak]="member.currentStreak"
          [crown]="member.hasCrown"
          [look]="member.look"
          [memberSince]="member.joinedAt"
          [showRibbon]="false"
          size="sm"
        />
        <app-user-name class="min-w-0 flex-1 truncate font-semibold" [name]="member.username" [look]="member.look" />
        @if (selected().includes(member.id)) {
          <ng-icon hlm name="lucideCheck" class="shrink-0 text-primary-text" aria-hidden="true" />
        }
      </span>
    </button>
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="selected().length !== 2"
  (click)="submit()"
>
  {{ t('vote.submit') }}
</button>
