<div class="flex flex-col gap-2">
  @for (option of question().options; track option.id) {
    <button
      type="button"
      [class]="optionClass(option.id)"
      [attr.aria-pressed]="selected().includes(option.id)"
      (click)="toggle(option.id)"
    >
      {{ option.text }}
    </button>
  }

  @if (question().allowOther) {
    <button
      type="button"
      [class]="otherClass()"
      [attr.aria-pressed]="otherSelected()"
      (click)="toggleOther()"
    >
      Otro...
    </button>
    @if (otherSelected()) {
      <input
        hlmInput
        maxlength="280"
        [value]="otherText()"
        (input)="onOtherInput($any($event.target).value)"
        placeholder="Escribe tu respuesta"
        class="w-full bg-background border-input text-foreground focus-visible:ring-2 focus-visible:ring-ring"
      />
    }
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="!isValid()"
  (click)="submit()"
>
  Votar
</button>
