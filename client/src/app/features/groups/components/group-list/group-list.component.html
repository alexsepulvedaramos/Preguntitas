<div class="p-4 flex flex-col gap-6 max-w-lg mx-auto">
  <section>
    <h2 class="text-xs font-bold uppercase tracking-widest text-primary mb-3">
      Tus grupos
    </h2>

    @if (loading()) {
      <div class="flex flex-col gap-3">
        @for (_ of [1, 2, 3]; track $index) {
          <div hlmSkeleton class="h-[72px] w-full rounded-xl"></div>
        }
      </div>
    } @else if (error()) {
      <div class="text-center py-8">
        <p class="font-display italic text-lg text-destructive">{{ error() }}</p>
      </div>
    } @else {
      <div class="flex flex-col gap-3">
        @for (group of groups(); track group.id) {
          <app-group-card [group]="group"></app-group-card>
        } @empty {
          <div class="text-center py-8">
            <p class="font-display italic text-lg text-primary/70">
              Todavía no tienes ningún grupo
            </p>
            <p class="text-sm text-muted-foreground mt-1">
              Crea uno o únete al grupo de un amigo
            </p>
          </div>
        }
      </div>
    }
  </section>

  <section class="flex flex-col gap-2">
    <app-create-group-dialog></app-create-group-dialog>
    <span class="text-center text-sm text-muted-foreground"> o </span>
    <app-join-group-dialog></app-join-group-dialog>
  </section>
</div>
