<div class="flex flex-col gap-4">
  @if (hasTarget()) {
    <p class="text-sm text-muted-foreground">
      {{ t('vote.about') }} <span class="text-foreground font-medium">{{ targetUsername() }}</span>
    </p>
  }

  <hlm-slider
    [value]="[value()]"
    [min]="min()"
    [max]="max()"
    [step]="1"
    (valueChange)="onValueChange($event)"
  />

  <p class="text-center text-2xl font-display italic text-foreground">{{ value() }}</p>
</div>

<button
  type="button"
  hlmBtn
  class="relative w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  (click)="submit()"
>
  {{ t('vote.submit') }}
  <app-vote-reward />
</button>
