<div
  class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-background/95 px-6 text-center backdrop-blur-sm animate-in fade-in-0 duration-300 motion-reduce:animate-none"
  role="dialog"
  aria-modal="true"
  aria-labelledby="streak-celebration-title"
  tabindex="-1"
  (click)="dismiss()"
>
  <div class="animate-in zoom-in-50 duration-500 motion-reduce:animate-none">
    <app-user-avatar
      [avatarUrl]="authService.currentUser()?.avatarUrl"
      [username]="authService.currentUser()?.username ?? ''"
      [frameColor]="frameStreak"
      [streak]="update().current"
      size="xl"
    />
  </div>

  <div class="flex flex-col items-center gap-1">
    <span class="text-sm font-semibold uppercase tracking-wide text-muted-foreground">
      🔥 Día
    </span>
    <span
      class="font-display text-7xl italic leading-none text-foreground tabular-nums"
      aria-live="polite"
    >
      @if (displayedCount() === update().current) {
        <span class="inline-block animate-pop motion-reduce:animate-none">{{ displayedCount() }}</span>
      } @else {
        <span class="inline-block opacity-60">{{ displayedCount() }}</span>
      }
    </span>
  </div>

  <div class="flex flex-col gap-1">
    <h2 id="streak-celebration-title" class="font-display text-3xl italic text-foreground">
      {{ title() }}
    </h2>
    <p class="text-sm text-muted-foreground">{{ subtitle() }}</p>
  </div>

  <div class="flex w-full max-w-xs flex-col items-center gap-2">
    @if (update().current < firstRingDays) {
      <div class="flex gap-3" aria-hidden="true">
        @for (filled of dots(); track $index) {
          <span
            class="size-4 rounded-full border-2 border-primary transition-colors duration-500"
            [class.bg-primary]="filled"
          ></span>
        }
      </div>
    } @else {
      <div class="h-2.5 w-full overflow-hidden rounded-full bg-muted" aria-hidden="true">
        <div
          class="h-full rounded-full bg-primary transition-[width] duration-700 ease-out motion-reduce:transition-none"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
    }
    <p class="text-xs text-muted-foreground">{{ nextTierLabel() }}</p>
  </div>

  <p class="text-xs text-muted-foreground/70">Toca para continuar</p>
</div>
