<!-- ── Shared bar row (reused in both interactive and static branches) ─────── -->
<ng-template #barRow>
  <div class="flex items-center gap-2">

    <!-- ── Bar ──────────────────────────────────────────────────────────────── -->
    <!-- Outer wrapper: relative but NO overflow-hidden so the lead avatar (z-10) can bleed out -->
    <div class="relative flex-1 h-10">
      <!-- Track (always full width) -->
      <div class="absolute inset-0 rounded-full bg-muted"></div>

      <!-- Fill. The leader's fill is their plate (rama 60, §17.18): drawn at the track's full
           width and clipped to the share, so the scene doesn't squash and the bar still reads. -->
      @if (plate(); as plate) {
        <div
          class="absolute inset-0 isolate overflow-hidden rounded-full transition-[clip-path] duration-500"
          [style.clip-path]="fillClip()"
        >
          <app-name-plate [plate]="plate" [streak]="groupStreaks.streakFor(leadUser()!.id)" />
        </div>
      } @else if (displayWidth() > 0) {
        <div
          class="absolute inset-y-0 left-0 rounded-full transition-[width] duration-500"
          [class]="isLeader() ? 'bg-primary/60' : 'bg-primary/25'"
          [style.width.%]="displayWidth()"
        ></div>
      }

      <!-- Avatar: z-10 so it sits above the fill, flush with left edge -->
      @if (leadUser()) {
        <div class="absolute left-0 inset-y-0 z-10 flex items-center">
          <app-user-avatar
            [avatarUrl]="leadUser()!.avatarUrl"
            [username]="leadUser()!.username"
            [frameColor]="leadUser()!.frameColor"
            [streak]="groupStreaks.streakFor(leadUser()!.id)"
            [crown]="groupStreaks.hasCrown(leadUser()!.id)"
            [look]="groupStreaks.lookFor(leadUser()!.id)"
            effects="full"
            size="md"
            class="ring-2 ring-background rounded-full"
          />
        </div>
      }

      <!-- Label overlay (z-20, above fill and avatar) -->
      <div
        class="absolute inset-0 z-20 flex items-center overflow-hidden"
        [class]="leadUser() ? 'pl-14' : 'pl-4'"
        [style.padding-right.px]="labelPaddingRight()"
        [style.clip-path]="plate() ? trackClip() : null"
      >
        <span class="text-sm font-semibold truncate text-foreground">{{ label() }}</span>
      </div>
      <!-- Over a plate the label is drawn twice: the plate's ink where the fill is, the normal
           text colour on the empty track, so it reads wherever the fill ends -->
      @if (plate()) {
        <div
          class="absolute inset-0 z-20 flex items-center overflow-hidden transition-[clip-path] duration-500"
          [class]="(leadUser() ? 'pl-14 ' : 'pl-4 ') + plateText()"
          [style.padding-right.px]="labelPaddingRight()"
          [style.clip-path]="fillClip()"
          aria-hidden="true"
        >
          <span class="text-sm font-semibold truncate">{{ label() }}</span>
        </div>
      }


      <!-- Who voted it: inside the bar, right side, vertically centred — never spilling
           onto the next row. Up to 4 faces; from 5, three and "+n". -->
      @if (voters().length > 0) {
        <app-voter-stack [voters]="voters()" class="absolute inset-y-0 right-2 z-30" />
      }
    </div>

    <!-- Percentage: always right, always readable -->
    <span class="text-sm font-bold text-foreground shrink-0 w-12 text-right tabular-nums">
      {{ percentage() }}%
    </span>
  </div>

  @if (subtitle()) {
    <span class="block text-xs text-muted-foreground truncate pl-4 -mt-0.5">{{ subtitle() }}</span>
  }
</ng-template>

<!-- ── Interactive branch (has voters → opens dialog) ──────────────────── -->
@if (hasAnyVoters()) {
  <hlm-dialog>
    <button
      type="button"
      hlmDialogTrigger
      class="w-full flex flex-col gap-1 outline-none focus-visible:ring-2 focus-visible:ring-ring rounded-default"
    >
      <ng-container *ngTemplateOutlet="barRow" />
    </button>

    <hlm-dialog-content *hlmDialogPortal class="w-sm max-w-[95vw]">
      <app-votes-summary [results]="allResults()" />
    </hlm-dialog-content>
  </hlm-dialog>

} @else {
  <!-- Static bar (no voters yet) -->
  <div class="flex flex-col gap-1">
    <ng-container *ngTemplateOutlet="barRow" />
  </div>
}
