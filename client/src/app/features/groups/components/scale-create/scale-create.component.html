<div class="flex flex-col gap-4">
  <label class="flex items-center gap-2 cursor-pointer select-none">
    <input
      type="checkbox"
      class="size-4 rounded border-input accent-accent focus-visible:ring-2 focus-visible:ring-ring"
      [checked]="aboutPerson()"
      (change)="toggleAboutPerson()"
    />
    <span class="text-sm text-foreground">¿Es sobre alguien del grupo?</span>
  </label>

  @if (aboutPerson()) {
    <div class="flex flex-col gap-1.5">
      <p class="text-sm text-muted-foreground">¿A quién se puntúa?</p>
      <div class="flex flex-col gap-2">
        @for (member of members(); track member.id) {
          <button
            type="button"
            [class]="optionClass(member.id)"
            [attr.aria-pressed]="targetUserId() === member.id"
            (click)="select(member.id)"
          >
            {{ member.username }}
          </button>
        }
      </div>
    </div>
  }

  <p class="text-sm text-muted-foreground">Cada uno puntúa del 1 al 10.</p>
</div>
