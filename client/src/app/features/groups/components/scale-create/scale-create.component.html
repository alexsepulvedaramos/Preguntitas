<div class="flex flex-col gap-4">
  <label class="flex items-center gap-2 cursor-pointer select-none">
    <hlm-checkbox [checked]="aboutPerson()" (checkedChange)="toggleAboutPerson()" />
    <span class="text-sm text-foreground">{{ t('createQuestion.aboutPerson') }}</span>
  </label>

  @if (aboutPerson()) {
    <div class="flex flex-col gap-1.5">
      <p class="text-sm text-muted-foreground">{{ t('createQuestion.whoRated') }}</p>
      <div class="flex flex-col gap-2">
        @for (member of members(); track member.id) {
          <button
            type="button"
            [class]="optionClass(member.id)"
            [attr.aria-pressed]="targetUserId() === member.id"
            (click)="select(member.id)"
          >
            {{ member.username }}
          </button>
        }
      </div>
    </div>
  }

  <p class="text-sm text-muted-foreground">{{ t('createQuestion.scaleNote') }}</p>
</div>
