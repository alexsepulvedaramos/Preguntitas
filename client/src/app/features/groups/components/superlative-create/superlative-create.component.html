<div class="flex flex-col gap-3">
  <label class="flex items-center gap-2 cursor-pointer select-none">
    <hlm-checkbox [checked]="allowNobody()" (checkedChange)="toggleAllowNobody()" />
    <span class="text-sm text-foreground">{{ t('createQuestion.allowNobody') }}</span>
  </label>

  <div class="flex flex-col gap-1.5">
    <label class="flex items-center gap-2 cursor-pointer select-none">
      <hlm-checkbox [checked]="showExclude()" (checkedChange)="toggleShowExclude()" />
      <span class="text-sm text-foreground">{{ t('createQuestion.exclude') }}</span>
    </label>
    @if (showExclude()) {
      <div class="flex flex-col gap-2 pt-1">
        @for (member of candidates(); track member.id) {
          <button
            type="button"
            [class]="optionClass(member.id)"
            [attr.aria-pressed]="blacklistedUserIds().includes(member.id)"
            (click)="toggle(member.id)"
          >
            {{ member.username }}
          </button>
        }
      </div>
    }
  </div>
</div>
