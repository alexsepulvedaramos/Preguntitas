<div class="flex flex-col gap-1">
  @for (team of question().teams; track $index; let isLast = $last) {
    <button
      type="button"
      [class]="optionClass($index)"
      [attr.aria-pressed]="selectedIndex() === $index"
      (click)="select($index)"
    >
      {{ teamLabel(team) }}
    </button>
    @if (!isLast) {
      <span class="text-center text-[11px] text-muted-foreground/70 tracking-wide select-none">vs</span>
    }
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="selectedIndex() === null"
  (click)="submit()"
>
  Votar
</button>
