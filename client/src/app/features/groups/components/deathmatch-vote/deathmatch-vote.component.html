<div class="flex flex-col gap-1">
  @for (team of question().teams; track $index; let isLast = $last) {
    <button
      type="button"
      [class]="optionClass($index)"
      [attr.aria-pressed]="selectedIndex() === $index"
      (click)="select($index)"
    >
      {{ teamLabel(team) }}
    </button>
    @if (!isLast) {
      <div class="flex items-center justify-center -my-1 relative z-10">
        <span
          class="flex items-center justify-center size-7 rounded-full bg-destructive text-destructive-foreground text-[10px] font-bold tracking-wide shadow"
          >VS</span
        >
      </div>
    }
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="selectedIndex() === null"
  (click)="submit()"
>
  Votar
</button>
