<div class="flex flex-col gap-2">
  @for (team of question().teams; track $index) {
    <button
      type="button"
      [class]="optionClass($index)"
      [class.animate-team-enter-left]="$index % 2 === 0"
      [class.animate-team-enter-right]="$index % 2 === 1"
      [style.animation-delay.ms]="$index * 120"
      [attr.aria-pressed]="selectedIndex() === $index"
      (click)="select($index)"
    >
      {{ teamLabel(team) }}
    </button>
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="selectedIndex() === null"
  (click)="submit()"
>
  Votar
</button>
