<div class="flex flex-col gap-4">
  @for (response of responses(); track response.voteId) {
    <div class="flex items-start gap-3">
      <button
        type="button"
        class="mt-1 shrink-0 rounded-full outline-none focus-visible:ring-2 focus-visible:ring-ring"
        (click)="openMemberCard(response.userId)"
        [attr.aria-label]="t('results.memberStats', { name: response.username })"
      >
        <app-user-avatar
          [avatarUrl]="response.avatarUrl"
          [username]="response.username"
          [frameColor]="response.frameColor"
          [streak]="groupStreaks.streakFor(response.userId)"
          [crown]="groupStreaks.hasCrown(response.userId)"
          [look]="groupStreaks.lookFor(response.userId)"
          [memberSince]="groupStreaks.joinedAtFor(response.userId)"
          size="md"
        />
      </button>
      <div class="flex min-w-0 flex-1 flex-col items-start gap-1">
        <div class="relative w-full rounded-default rounded-tl-sm border border-border bg-card px-3.5 py-2.5 shadow-sm">
          <span class="block text-xs font-semibold text-muted-foreground">{{ response.username }}</span>
          <p class="text-sm text-foreground whitespace-pre-wrap break-words">{{ response.text }}</p>
        </div>
        @if (groupStreaks.currentGroupId(); as groupId) {
          <app-reactions
            [groupId]="groupId"
            [target]="{ kind: 'answers', id: response.voteId }"
            [authorId]="response.userId"
            [reactions]="response.reactions"
          />
        }
      </div>
    </div>
  } @empty {
    <p class="text-sm text-muted-foreground">{{ t('results.noResponses') }}</p>
  }
</div>
