<div class="flex flex-col gap-2">
  @for (response of responses(); track $index) {
    <div class="rounded-lg border border-border bg-card/40 px-3 py-2 flex flex-col gap-0.5">
      <span class="text-xs font-medium text-muted-foreground">{{ response.username }}</span>
      <span class="text-sm text-foreground whitespace-pre-wrap break-words">{{ response.text }}</span>
    </div>
  } @empty {
    <p class="text-sm text-muted-foreground">Aún no hay respuestas.</p>
  }
</div>
