<div class="flex flex-col gap-2">
  @for (member of candidates(); track member.id) {
    <button
      type="button"
      [class]="optionClass(member.id) + ' py-2.5'"
      [attr.aria-pressed]="selected() === member.id"
      (click)="select(member.id)"
    >
      <span class="flex items-center gap-3">
        <app-user-avatar
          [avatarUrl]="member.avatarUrl"
          [username]="member.username"
          [frameColor]="member.frameColor"
          [streak]="member.currentStreak"
          [crown]="member.hasCrown"
          [look]="member.look"
          [showRibbon]="false"
          effects="full"
          size="sm"
        />
        <app-user-name class="min-w-0 flex-1 truncate font-semibold" [name]="member.username" />
        @if (selected() === member.id) {
          <ng-icon hlm name="lucideCheck" class="shrink-0 text-primary-text" aria-hidden="true" />
        }
      </span>
    </button>
  }

  @if (question().allowNobody) {
    <button
      type="button"
      [class]="optionClass(NOBODY_ID)"
      [attr.aria-pressed]="selected() === NOBODY_ID"
      (click)="select(NOBODY_ID)"
    >
      {{ t('vote.nobody') }}
    </button>
  }
</div>

<button
  type="button"
  hlmBtn
  class="w-full mt-2 focus-visible:ring-2 focus-visible:ring-ring"
  [disabled]="selected() === null"
  (click)="submit()"
>
  {{ t('vote.submit') }}
</button>
