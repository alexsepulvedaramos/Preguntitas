<div class="flex flex-col items-center gap-0.5 pb-2">
  <span class="text-xs uppercase tracking-wide text-muted-foreground">{{
    leader() ? t('results.leading') : t('results.result')
  }}</span>
  <span class="font-display text-2xl text-primary-text text-center truncate max-w-full">{{ leader() ?? t('results.tie') }}</span>
</div>

<div class="flex flex-col gap-1">
  @for (option of result().results; track option.id; let i = $index; let isLast = $last) {
    <app-result-option-bar
      [label]="option.displayText"
      [voteCount]="option.voteCount"
      [percentage]="option.percentage"
      [voters]="option.voters"
      [allResults]="result().results"
      [class.animate-result-enter-left]="i % 2 === 0"
      [class.animate-result-enter-right]="i % 2 === 1"
      [style.animation-delay.ms]="i * 70"
    />
    <!-- Who is in the team, big enough to show their frames (rama 57) -->
    <div class="flex flex-wrap items-center justify-center gap-x-5 gap-y-3 py-2" aria-hidden="true">
      @for (member of option.teamMembers; track member.id) {
        <app-user-avatar
          [avatarUrl]="member.avatarUrl"
          [username]="member.username"
          [frameColor]="member.frameColor"
          [streak]="groupStreaks.streakFor(member.id)"
          [crown]="groupStreaks.hasCrown(member.id)"
          [look]="groupStreaks.lookFor(member.id)"
          [showRibbon]="false"
          effects="full"
          size="md"
        />
      }
    </div>
    @if (!isLast) {
      <span class="text-center text-2xs text-muted-foreground/70 tracking-wide select-none">vs</span>
    }
  }
</div>
