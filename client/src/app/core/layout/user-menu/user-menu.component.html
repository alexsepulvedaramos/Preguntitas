<hlm-drawer direction="right">
  <button
    hlmDrawerTrigger
    hlmBtn
    size="icon"
    variant="ghost"
    class="rounded-full hover:bg-muted w-9 h-9 p-0 flex items-center justify-center focus-visible:ring-2 focus-visible:ring-ring outline-none"
    aria-label="Menú de usuario"
  >
    <ng-icon hlm name="lucideCircleUserRound" class="size-6! text-foreground" />
  </button>

  <hlm-drawer-overlay hlm />

  <hlm-drawer-content
    *hlmDrawerPortal="let ctx"
    class="w-full sm:w-100 flex flex-col h-full bg-card border-l border-border"
  >
    <button
      hlmBtn
      variant="outline"
      size="icon"
      class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
      (click)="ctx.close()"
    >
      <ng-icon hlm name="lucideX" class="size-4 text-foreground" />
      <span class="sr-only">Cerrar</span>
    </button>

    <hlm-drawer-header class="pb-4">
      <h3
        hlmDrawerTitle
        class="font-display text-xl italic tracking-tight text-foreground"
      >
        Perfil
      </h3>
    </hlm-drawer-header>

    <div class="flex flex-col gap-6 p-6 h-full">
      <!-- User identity card -->
      <div class="flex items-center gap-5 rounded-xl bg-muted/50 p-4">
        <hlm-avatar size="default" class="size-14 shrink-0">
          @if (authService.currentUser()?.avatarUrl) {
            <img
              hlmAvatarImage
              [src]="authService.currentUser()!.avatarUrl!"
              alt="Avatar"
            />
          }
          <span
            hlmAvatarFallback
            class="text-lg font-semibold bg-primary/15 text-primary"
          >
            @if (initials()) {
              {{ initials() }}
            } @else {
              <ng-icon hlm name="lucideUser" class="size-6!" />
            }
          </span>
        </hlm-avatar>
        <div class="flex flex-col min-w-0">
          <span class="font-semibold text-foreground truncate">
            {{ authService.currentUser()?.username }}
          </span>
          <span class="text-xs text-muted-foreground truncate">
            {{ authService.currentUser()?.email }}
          </span>
        </div>
      </div>

      <div class="flex-1"></div>

      <button
        hlmBtn
        variant="destructive"
        class="w-full gap-2 focus-visible:ring-2 focus-visible:ring-destructive"
        (click)="logout(ctx)"
      >
        <ng-icon hlm name="lucideLogOut" />
        Cerrar sesión
      </button>
    </div>
  </hlm-drawer-content>
</hlm-drawer>
