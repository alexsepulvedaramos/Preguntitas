<header
  class="sticky top-0 z-50 flex items-center justify-between gap-4 border-b border-border bg-card/90 px-4 py-3 backdrop-blur-md transition-colors duration-200"
  [class.max-sm:hidden]="inGroup()"
>
  <a
    [routerLink]="authService.isAuthenticated() ? '/groups' : '/'"
    class="min-w-0 whitespace-nowrap rounded-default focus-visible:ring-2 focus-visible:ring-ring outline-none"
    [attr.aria-label]="t('layout.home')"
  >
    <app-logo-wordmark />
  </a>

  <div class="flex items-center gap-1.5">
    @if (authService.isAuthenticated()) {
      <app-user-menu></app-user-menu>
    } @else {
      <!-- Signed-in users pick the theme and language from the user menu -->
      <app-language-picker />
      <app-theme></app-theme>
    }
  </div>
</header>
