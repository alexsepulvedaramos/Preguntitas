name: Deploy Backend to Render

on:
  push:
    branches:
      - master
    # Only trigger if files inside the server folder change
    paths:
      - 'server/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Set the default working directory for all run steps in this job
    defaults:
      run:
        working-directory: ./server

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore the whole solution so the test project's packages are available too
      - name: Restore dependencies
        run: dotnet restore VayaPreguntita.slnx

      # Build API + tests in Release mode (the Test step below reuses this build)
      - name: Build
        run: dotnet build VayaPreguntita.slnx --configuration Release --no-restore

      # Integration tests spin up PostgreSQL via Testcontainers (Docker is available on ubuntu-latest).
      # Fail loudly if no tests are discovered instead of silently passing.
      - name: Test
        run: dotnet test VayaPreguntita.slnx --configuration Release --no-build --verbosity normal --logger "console;verbosity=normal"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only execute deployment if the build step is successful
    if: success()

    steps:
      # Send a POST request to the Render Deploy Hook
      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$DEPLOY_HOOK_URL"
