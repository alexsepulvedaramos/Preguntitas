name: CI

# Build + tests for both stacks on every PR, and on master so the README badge
# reflects the deployed branch. Deploys stay in deploy-backend.yml (Render) and Vercel.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# A newer push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server · .NET build + tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VayaPreguntita.slnx

      - name: Build
        run: dotnet build VayaPreguntita.slnx --configuration Release --no-restore

      # Domain and integration tests run against PostgreSQL via Testcontainers
      # (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test VayaPreguntita.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  client:
    name: Client · Angular build + tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
